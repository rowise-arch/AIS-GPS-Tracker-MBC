<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AIS GPS Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="styles.css">
</head><body>
<main class="app-shell"><header class="topbar"><a class="brand" href="/"><span class="brand-mark"><i></i><i></i><i></i></span><span>AIS <strong>TRACKER</strong></span></a><div class="connection" id="connectionStatus"><span class="status-dot"></span><span>Connecting</span></div></header>
<section class="dashboard"><aside class="sidebar"><div class="eyebrow">LIVE POSITION</div><h1 id="trackerName">Tracker offline</h1><p class="subtitle" id="trackerId">Waiting for Firebase data</p>
<div class="coordinate-card"><div><span>LATITUDE</span><strong id="latitude">--.------°</strong></div><div><span>LONGITUDE</span><strong id="longitude">--.------°</strong></div></div>
<dl class="telemetry"><div><dt>Last update</dt><dd id="lastUpdated">No signal</dd></div><div><dt>GPS accuracy</dt><dd id="accuracy">-- m</dd></div><div><dt>Battery</dt><dd id="battery">--%</dd></div></dl>
<div class="signal-card"><div class="signal-heading"><span>LoRa signal</span><strong id="rssi">-- dBm</strong></div><div class="signal-bars"><i></i><i></i><i></i><i></i></div></div><p class="help-text">The map updates when the base station writes a location.</p></aside>
<section class="map-panel"><div id="map"></div><div class="map-overlay"><span class="pulse"></span><span>LIVE LOCATION</span></div><button class="locate-button" id="locateButton" type="button" aria-label="Center map on tracker">⌖</button></section></section></main>
<template id="markerTemplate"><div class="tracker-marker"><span></span></div></template>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module" src="app.js"></script>
</body></html>
